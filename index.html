<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Puzzle</title>
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}
body{
background:#111;
color:white;
font-family:sans-serif;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}
#menuBar{
height:50px;
background:#222;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
flex-shrink:0;
}
#menuBar button{
padding:6px 12px;
}
#enemySection,
#playerSection{
display:flex;
align-items:center;
gap:10px;
padding:5px 10px;
}
.characterImage{
width:72px;
height:72px;
object-fit:cover;
background:#333;
border-radius:12px;
}
.gaugeArea{
flex:1;
}
.gaugeLabel{
font-size:12px;
margin-bottom:2px;
}
.gauge{
width:100%;
height:14px;
background:#333;
border-radius:10px;
overflow:hidden;
margin-bottom:6px;
}
.hpFill{
height:100%;
width:100%;
background:#00ff66;
}
.attackFill{
height:100%;
width:0%;
background:orange;
}
#boardArea{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:5px;
}
#board{
background:#222;
border-radius:12px;
touch-action:none;
}
#adArea{
height:60px;
background:#222;
display:flex;
justify-content:center;
align-items:center;
flex-shrink:0;
}
</style>
</head>
<body>
<header id="menuBar">

MENU

<div>Battle Puzzle</div>

SET

</header>
<section id="enemySection">
<div class="gaugeArea">
<div class="gaugeLabel">HP</div>
<div class="gauge">
<div
id="enemyHp"
class="hpFill">
</div>
</div>
<div class="gaugeLabel">ATK</div>
<div class="gauge">
<div
id="enemyAttack"
class="attackFill">
</div>
</div>
</div>
</section>
<div id="boardArea">
</div>
<section id="playerSection">
<div class="gaugeArea">
<div class="gaugeLabel">HP</div>
<div class="gauge">
<div
id="playerHp"
class="hpFill">
</div>
</div>
<div class="gaugeLabel">ATK</div>
<div class="gauge">
<div
id="playerAttack"
class="attackFill">
</div>
</div>
</div>
</section>
<footer id="adArea">

広告エリア

</footer>
<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const SIZE=5;
const boardSize=Math.min(
window.innerWidth*0.75,
window.innerHeight*0.35
);
const CELL=Math.floor(
boardSize/SIZE
);
canvas.width=CELL*SIZE;
canvas.height=CELL*SIZE;
const COLORS=[
"#ff4444",
"#4488ff",
"#44dd66",
"#ffcc33"
];
let board=[];
let playerHP=100;
let enemyHP=100;
let playerGauge=0;
let enemyGauge=0;
function createBoard(){
board=[];
for(let y=0;y<SIZE;y++){
let row=[];
for(let x=0;x<SIZE;x++){
row.push(
Math.floor(Math.random()*4)
);
}
board.push(row);
}
}
function draw(){
ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);
for(let y=0;y<SIZE;y++){
for(let x=0;x<SIZE;x++){
ctx.beginPath();
ctx.fillStyle=
COLORS[
board[y][x]
];
ctx.arc(
x*CELL+CELL/2,
y*CELL+CELL/2,
CELL/2-3,
0,
Math.PI*2
);
ctx.fill();
}
}
}
function findMatches(){
let matches=[];
for(let y=0;y<SIZE;y++){
let count=1;
for(let x=1;x<SIZE;x++){
if(
board[y][x]===
board[y][x-1]
){
count++;
}else{
if(count>=3){
for(let k=0;k<count;k++){
matches.push([
x-1-k,
y
]);
}
}
count=1;
}
}
if(count>=3){
for(let k=0;k<count;k++){
matches.push([
SIZE-1-k,
y
]);
}
}
}
for(let x=0;x<SIZE;x++){
let count=1;
for(let y=1;y<SIZE;y++){
if(
board[y][x]===
board[y-1][x]
){
count++;
}else{
if(count>=3){
for(let k=0;k<count;k++){
matches.push([
x,
y-1-k
]);
}
}
count=1;
}
}
if(count>=3){
for(let k=0;k<count;k++){
matches.push([
x,
SIZE-1-k
]);
}
}
}
return matches;
}
function removeMatches(matches){
matches.forEach(m=>{
board[m[1]][m[0]]=-1;
});
playerGauge=
Math.min(
100,
playerGauge+matches.length
);
enemyHP=
Math.max(
0,
enemyHP-Math.floor(matches.length/3)
);
}
function dropPieces(){
for(let x=0;x<SIZE;x++){
let col=[];
for(let y=SIZE-1;y>=0;y--){
if(board[y][x]!==-1){
col.push(
board[y][x]
);
}
}
while(col.length<SIZE){
col.push(
Math.floor(Math.random()*4)
);
}
for(let y=SIZE-1;y>=0;y--){
board[y][x]=
col[SIZE-1-y];
}
}
}
function resolveBoard(){
let matches=
findMatches();
if(matches.length===0){
return;
}
removeMatches(matches);
dropPieces();
setTimeout(
resolveBoard,
200
);
}
let startX;
let startY;
canvas.addEventListener(
"pointerdown",
e=>{
const rect=
canvas.getBoundingClientRect();
startX=
Math.floor(
(e.clientX-rect.left)
/CELL
);
startY=
Math.floor(
(e.clientY-rect.top)
/CELL
);
}
);
canvas.addEventListener(
"pointerup",
e=>{
const rect=
canvas.getBoundingClientRect();
let endX=
Math.floor(
(e.clientX-rect.left)
/CELL
);
let endY=
Math.floor(
(e.clientY-rect.top)
/CELL
);
if(
Math.abs(endX-startX)+
Math.abs(endY-startY)!==1
){
return;
}
let temp=
board[startY][startX];
board[startY][startX]=
board[endY][endX];
board[endY][endX]=
temp;
let matches=
findMatches();
if(matches.length===0){
temp=
board[startY][startX];
board[startY][startX]=
board[endY][endX];
board[endY][endX]=
temp;
return;
}
resolveBoard();
}
);
function updateBars(){
document
.getElementById("playerHp")
.style.width=
`${playerHP}%`;
document
.getElementById("enemyHp")
.style.width=
`${enemyHP}%`;
document
.getElementById("playerAttack")
.style.width=
`${playerGauge}%`;
document
.getElementById("enemyAttack")
.style.width=
`${enemyGauge}%`;
}
function loop(){
draw();
updateBars();
requestAnimationFrame(
loop
);
}
createBoard();
resolveBoard();
loop();
</script>
</body>
</html>
