<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AI育成ゲーム</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
AI育成ゲーム
</header>

<div id="game">

<div id="characterCard">

<img id="avatar" src="img/IMG_9485.png" alt="ミライ">

<div id="name">ミライ</div>

<div id="level">Lv.1</div>

<div class="progress">
<div id="loveBar" class="progressBar"></div>
</div>

<div id="status">

<div class="statusBox">
❤️ 好感度
<div id="love">0</div>
</div>

<div class="statusBox">
🪙 コイン
<div id="coin">0</div>
</div>

</div>

</div>

<div id="chat"></div>

<div id="inputArea">
<input id="message" placeholder="ミライに話しかけよう">
<button id="sendBtn">送信</button>
</div>

<div id="games">

<button class="gameBtn" onclick="searchCoin()">
🪙 コイン探し
</button>

<button class="gameBtn" onclick="playJanken()">
✊ じゃんけん
</button>

<button class="gameBtn" onclick="dailyBonus()">
🎁 ログインボーナス
</button>

<button class="gameBtn" onclick="buyGift()">
🎀 プレゼント
</button>

</div>

<div id="eventBox">
ミライと仲良くなろう！
</div>

</div>

<script src="script.js" defer></script>

</body>
</html>
