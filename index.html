<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>育成ゲーム</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }
    .game-container {
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }
    .character {
      text-align: center;
      padding: 10px;
    }
    .character img {
      width: 150px;
      height: 150px;
    }
    .conversation-log {
      height: 100px;
      overflow-y: auto;
      background: #f9f9f9;
      padding: 5px;
      border-top: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
    }
    .input-container {
      display: flex;
    }
    .input-container input {
      flex: 1;
      border: 1px solid #ccc;
      border-right: none;
      padding: 5px;
    }
    .input-container button {
      border: 1px solid #ccc;
      background: #eee;
      padding: 5px;
      cursor: pointer;
    }
    .status {
      padding: 10px;
      font-size: 14px;
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="character">
      <img src="character.png" alt="キャラクター">
    </div>
    <div class="conversation-log" id="conversation-log"></div>
    <div class="input-container">
      <input type="text" id="input" placeholder="話しかける">
      <button id="send">送信</button>
    </div>
    <div class="status">
      好感度: <span id="affection">0</span> コイン: <span id="coins">0</span>
    </div>
    <button id="mini-game">ミニゲーム</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
