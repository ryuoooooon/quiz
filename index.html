<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Puzzle</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="menuBar">
    <button>MENU</button>
    <div>Battle Puzzle</div>
    <button>SET</button>
</div>

<div id="enemySection">
    <img class="characterImage">
    <div class="gaugeArea">
        <div class="gauge"><div id="enemyHp" class="hpFill"></div></div>
        <div class="gauge"><div id="enemyAttack" class="attackFill"></div></div>
    </div>
</div>

<div id="boardArea">
    <canvas id="board"></canvas>
</div>

<div id="playerSection">
    <img class="characterImage">
    <div class="gaugeArea">
        <div class="gauge"><div id="playerHp" class="hpFill"></div></div>
        <div class="gauge"><div id="playerAttack" class="attackFill"></div></div>
    </div>
</div>

<div id="adArea">AD</div>

<script src="game.js"></script>

</body>
</html>
