<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>マザーAIと話そう</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
マザーAIと話そう
</header>

<div id="game">

<div id="characterCard">

<img id="avatar" src="./img/IMG_9486.png" alt="ミライ" onerror="this.style.border='3px solid red';this.alt='画像なし';">

<div id="name">花海咲季</div>

<div id="level">Lv.1</div>

<div class="progress">
<div id="loveBar" class="progressBar"></div>
</div>

<div id="status">

<div class="statusBox">
❤️ 親愛度
<div id="love">0</div>
</div>

<div class="statusBox">
🪙 マニー
<div id="coin">0</div>
</div>

</div>

</div>

<div id="chat"></div>

<div id="inputArea">
<input id="message" placeholder="咲季おねえちゃんに話しかけよう">
<button id="sendBtn">送信</button>
</div>

<div id="games">

<button class="gameBtn" onclick="searchCoin()">
🪙 マニー探し
</button>

<button class="gameBtn" onclick="playJanken()">
✊ じゃんけん
</button>

<button class="gameBtn" onclick="dailyBonus()">
🎁 ログインボーナス
</button>

<button class="gameBtn" onclick="buyGift()">
🎀 プレゼント
</button>

<button class="gameBtn" onclick="gacha()">
🎲 ガチャ
</button>

<button class="gameBtn" onclick="collectIdleReward()">
💰 放置報酬
</button>

</div>

<div id="eventBox">
咲季おねえちゃんと仲良くなろう！
</div>

</div>

<script src="script.js" defer></script>

</body>
</html>
