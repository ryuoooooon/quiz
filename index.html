<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オンライン教材サイト - StudyText</title>

<style>
:root {
    --primary-color: #0ea5e9;
    --bg-color: #f8fafc;
    --surface-color: #ffffff;
    --text-main: #334155;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --accent-bg: #f0f9ff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    line-height: 1.8;
}

/* ヘッダー */
header{
    position:sticky;
    top:0;
    z-index:100;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-color);
}

h1{
    margin:0;
    padding:16px 12px 12px;
    font-size:18px;
    font-weight: 700;
    text-align:center;
    color: #0f172a;
}

/* タブナビゲーション */
.tabs{
    display:flex;
    justify-content: center;
    overflow-x:auto;
    gap:8px;
    padding:12px 16px;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 600;
    border:none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    cursor:pointer;
    transition: all 0.2s ease;
    white-space: nowrap; 
}

.tab:hover {
    background: var(--border-color);
    color: var(--text-main);
}

.tab.active{
    background: var(--primary-color);
    color: white;
    box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
}

/* メインコンテンツ */
main{
    padding: 30px 16px;
    max-width: 760px;
    margin: 0 auto;
}

.lesson-content {
    background: var(--surface-color);
    border-radius:16px;
    padding: 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    margin-bottom: 40px;
}

/* タイポグラフィ */
.lesson-content h2 {
    font-size:18px;
    color: #0f172a;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 12px;
    margin-top: 0;
    margin-bottom: 24px;
}

.lesson-content h3 {
    font-size: 18px;
    color: var(--primary-color);
    margin-top: 32px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
}
.lesson-content h3::before {
    content: "■";
    margin-right: 8px;
    font-size: 14px;
}

.lesson-content p {
    margin-bottom: 20px;
}

.lesson-content ul {
    background: var(--bg-color);
    padding: 20px 20px 20px 40px;
    border-radius: 8px;
    margin-bottom: 24px;
}

.lesson-content li {
    margin-bottom: 8px;
}

.important-box {
    background: var(--accent-bg);
    border-left: 4px solid var(--primary-color);
    padding: 16px 20px;
    border-radius: 0 8px 8px 0;
    margin: 24px 0;
}

.important-box strong {
    color: var(--primary-color);
    display: block;
    margin-bottom: 8px;
}

/* ==========================================
   🗣️ チャット（キャラクター対話）用のCSS（★修正＆最適化）
========================================== */
.chat-wrap {
    display: flex;
    flex-direction: column;
    gap: 24px;          
    margin: 30px 0;     
}

.chat-row {
    display: flex;
    align-items: flex-start; /* アイコンと右側コンテンツの上端を揃える */
    gap: 16px;
}

/* アイコン画像のスタイル（丸型に切り抜き） */
.chat-avatar-img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0; /* 画面が狭くなっても画像が潰れないように固定 */
}

/* 右側コンテンツ（名前と吹き出しを縦並びにする） */
.chat-content-box {
    display: flex;
    flex-direction: column;
    align-items: flex-start; /* 左揃えにする */
    gap: 6px;                /* 名前と吹き出しの隙間 */
}

/* キャラクターの名前 */
.chat-name {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: bold;
}

/* 吹き出し本体（修正） */
.chat-bubble {
    background: #00a2e8; /* 画像に近い鮮やかな水色/青 */
    color: #ffffff;      /* 白文字 */
    padding: 12px 20px;
    border-radius: 12px; /* 全体を角丸に */
    line-height: 1.6;
    font-size: 15px;
    font-weight: bold;
    display: inline-block; 

    /* ★追加：しっぽの基準位置にするため relative を指定 */
    position: relative; 
    
    /* ★追加：しっぽを作る際、左上の角を尖らせることでしっぽと繋がっているように見せる */
    border-top-left-radius: 4px;
}

/* ★追加：吹き出しのしっぽ（突起）部分 */
.chat-bubble::before {
    content: ""; /* 擬似要素には必須 */
    position: absolute;
    
    /* 位置の調整：吹き出し本体の左上に配置 */
    top: 0px;       /* 吹き出しの上端と合わせる */
    left: 0px;     /* 吹き出しの左側に飛び出させる */
    
    /* 三角形を作るトリック：ボーダーを使用 */
    border-width: 14px 14px 0 0;  /* 三角形のサイズと向き */
    border-style: solid;
    border-color: #00a2e8 transparent transparent transparent; /* 背景色と同じ青、他は透明 */
    
    /* 綺麗に表示させるための微調整（お好みで） */
    border-top-right-radius: 4px;
}


/* フッター */
footer{
    text-align:center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size:14px;
    border-top: 1px solid var(--border-color);
}

@media (max-width: 600px) {
    .lesson-content {
        padding: 24px 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>資格勉強用のサイト</h1>
    <div class="tabs" id="tabs"></div>
</header>

<main>
    <div class="lesson-content" id="contentArea"></div>
</main>

<footer>
    © 2026 メーカー勤務理系おじさん
</footer>

<script>
const courseData = [
    {
        id: "xray",
        tabName: "Study",  
        content: `
            <h2>大気関係第1種公害防止管理者</h2>
            <p>これだけ覚えておけば受かるよ(たぶん)</p>
            <ul>
                <li>あ</li>
                <li>た</li>
            </ul>
            
            <div class="chat-wrap">
                <div class="chat-row">
                    <img src="images/IMG_9486.png" class="chat-avatar-img" alt="花海咲季">
                    
                    <div class="chat-content-box">
                        <div class="chat-name">通りすがりの花海咲季さん</div>
                        <div class="chat-bubble">今の実力がどうとか関係ない。本気で勉強して受かればいいのよ。</div>
                    </div>
                </div>
            </div>
        `
    },
    {
        id: "kiken",
        tabName: "Notes",
        content: `
            <h2>過去問の暗記しか勝たん</h2>
            <p>6割以上過去問から出てるんだから</p>
            <h3>暗記のコツは"理解"</h3>
            <ul>
                <li>もの）</li>
                <li>）</li>
                <li>（）</li>
            </ul>
        `
    },
    {
        id: "qc",
        tabName: "Chill",
        content: `
            <h2>筋トレってコスパ悪くない？</h2>
            <p>。</p>
            <h3>？</h3>
            <p>。</p>
        `
    },
    {
        id: "fp",
        tabName: " Coming Soon",
        content: `
            <h2>篠澤広</h2>
            <p>。</p>
            <div class="important-box">
                <strong>あ</strong>
            </div>
        `
    }
];

const tabsContainer = document.getElementById("tabs");
const contentArea = document.getElementById("contentArea");

function initializeSite() {
    courseData.forEach((course, index) => {
        const btn = document.createElement("button");
        btn.className = "tab";
        btn.textContent = course.tabName; 
        
        if (index === 0) {
            btn.classList.add("active");
            loadLesson(course.id); 
        }

        btn.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");
            loadLesson(course.id);
        });

        tabsContainer.appendChild(btn);
    });
}

function loadLesson(subjectId) {
    const course = courseData.find(item => item.id === subjectId);
    if (course) {
        contentArea.innerHTML = course.content;
    } else {
        contentArea.innerHTML = "<h2>準備中</h2><p>この科目のコンテンツは現在作成中です。</p>";
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initializeSite;
</script>

</body>
</html>
