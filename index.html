<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オンライン教材サイト - StudyText</title>

<style>
:root {
    --primary-color: #0ea5e9;
    --bg-color: #f8fafc;
    --surface-color: #ffffff;
    --text-main: #334155;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --accent-bg: #f0f9ff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    line-height: 1.8;
}

/* ヘッダー */
header{
    position:sticky;
    top:0;
    z-index:100;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-color);
}

h1{
    margin:0;
    padding:16px 12px 12px;
    font-size:22px;
    font-weight: 700;
    text-align:center;
    color: #0f172a;
}

/* タブナビゲーション */
.tabs{
    display:flex;
    justify-content: center;
    overflow-x:auto;
    gap:8px;
    padding:12px 16px;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 600;
    border:none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    cursor:pointer;
    transition: all 0.2s ease;
    white-space: nowrap; /* 文字落ち防止 */
}

.tab:hover {
    background: var(--border-color);
    color: var(--text-main);
}

.tab.active{
    background: var(--primary-color);
    color: white;
    box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
}

/* メインコンテンツ */
main{
    padding: 30px 16px;
    max-width: 760px;
    margin: 0 auto;
}

.lesson-content {
    background: var(--surface-color);
    border-radius:16px;
    padding: 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    margin-bottom: 40px;
}

/* タイポグラフィ */
.lesson-content h2 {
    font-size: 24px;
    color: #0f172a;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 12px;
    margin-top: 0;
    margin-bottom: 24px;
}

.lesson-content h3 {
    font-size: 18px;
    color: var(--primary-color);
    margin-top: 32px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
}
.lesson-content h3::before {
    content: "■";
    margin-right: 8px;
    font-size: 14px;
}

.lesson-content p {
    margin-bottom: 20px;
}

.lesson-content ul {
    background: var(--bg-color);
    padding: 20px 20px 20px 40px;
    border-radius: 8px;
    margin-bottom: 24px;
}

.lesson-content li {
    margin-bottom: 8px;
}

.important-box {
    background: var(--accent-bg);
    border-left: 4px solid var(--primary-color);
    padding: 16px 20px;
    border-radius: 0 8px 8px 0;
    margin: 24px 0;
}

.important-box strong {
    color: var(--primary-color);
    display: block;
    margin-bottom: 8px;
}

/* ==========================================
   🗣️ チャット（キャラクター対話）用のCSS
========================================== */
.chat-wrap {
    display: flex;
    flex-direction: column;
    gap: 24px;          /* 発言と発言の上下の間隔 */
    margin: 30px 0;     /* チャットエリア全体の上下の余白 */
}

.chat-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
}

/* 右側（生徒側）は要素の並び順を逆にする */
.chat-row.right {
    flex-direction: row-reverse;
}

/* 丸いアイコン（今回は絵文字） */
.chat-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* 発言全体の横幅制限 */
.chat-content {
    max-width: 75%;
}

/* キャラクターの名前 */
.chat-name {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: bold;
}

.chat-row.right .chat-name {
    text-align: right;
}

/* 吹き出しの共通デザイン */
.chat-bubble {
    padding: 14px 18px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 15px;
    position: relative;
}

/* 左側（先生）専用：薄グレーの背景 ＋ 左上の角を尖らせる */
.chat-row.left .chat-bubble {
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-top-left-radius: 4px; 
}

/* 右側（生徒）専用：テーマカラーの背景 ＋ 右上の角を尖らせる */
.chat-row.right .chat-bubble {
    background: var(--primary-color);
    color: white;
    border-top-right-radius: 4px; 
}

/* スマホ表示のとき、吹き出しの横幅を少し広げる（レスポンシブ対応） */
@media (max-width: 600px) {
    .chat-content {
        max-width: 85%;
    }
}


/* フッター */
footer{
    text-align:center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size:14px;
    border-top: 1px solid var(--border-color);
}

@media (max-width: 600px) {
    .lesson-content {
        padding: 24px 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>趣味の部屋</h1>
    <div class="tabs" id="tabs"></div>
</header>

<main>
    <div class="lesson-content" id="contentArea"></div>
</main>

<footer>
    © 2026 メーカー勤務理系おじさん
</footer>

<script>
// ==========================================
// 💡 設定エリア：ここだけを編集すればOKです！
// ==========================================
const courseData = [
    {
        id: "xray",
        tabName: "Study",  // ← ここを変えればタブの名前も変わります！
        content: `
            <h2>X線作業主任者</h2>
            <p>これだけ覚えておけば受かる(たぶん)</p>
            <p></p>
            <ul>
                <li>あ</li>
                <li>た</li>
            </ul>
            
            <div class="chat-wrap">

    
    <div class="chat-row left">
        <div class="chat-avatar">👩‍🏫</div> <div class="chat-content">
            <div class="chat-name">先生</div> <div class="chat-bubble">
                ここに左側のキャラクターのセリフを書きます。
            </div>
        </div>
    </div>

    <div class="chat-row right">
        <img src="images/IMG_9486.png" style="width: 100%; height: 100%; object-fit: cover;">
        <div class="chat-content">
            <div class="chat-name">初心者くん</div>
            <div class="chat-bubble">
                ここに右側のキャラクターのセリフを書きます。
            </div>
        </div>
    </div>
    
</div>

            
        `
    },
    {
        id: "kiken",
        tabName: "Notes",
        content: `
            <h2>過去問の暗記しか勝たん</h2>
            <p>6割以上過去問から出てるんだから</p>
            <h3>暗記のコツは"理解"</h3>
            <ul>
                <li>もの）</li>
                <li>）</li>
                <li>（）</li>
            </ul>
        `
    },
    {
        id: "qc",
        tabName: "Chill",
        content: `
            <h2>筋トレってコスパ悪くない？</h2>
            <p>。</p>
            <h3>？</h3>
            <p>。</p>
        `
    },
    {
        id: "fp",
        tabName: " Coming Soon",
        content: `
            <h2>篠澤広</h2>
            <p>。</p>
            <div class="important-box">
                <strong>あ</strong>
            </div>
        `
    }
];
// ==========================================
// これ以降のシステム部分は自動で動くので編集不要です
// ==========================================

const tabsContainer = document.getElementById("tabs");
const contentArea = document.getElementById("contentArea");

// 1. タブを自動生成する関数
function initializeSite() {
    courseData.forEach((course, index) => {
        // ボタン要素を作成
        const btn = document.createElement("button");
        btn.className = "tab";
        btn.textContent = course.tabName; // データからタブ名をセット
        
        // 最初の一つだけ「active」状態にする
        if (index === 0) {
            btn.classList.add("active");
            loadLesson(course.id); // 最初のコンテンツを表示
        }

        // タップした時の動き
        btn.addEventListener("click", () => {
            // 全てのタブからactiveを外して、クリックしたタブに付ける
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");
            
            // 該当するコンテンツを表示
            loadLesson(course.id);
        });

        // ヘッダーにボタンを追加
        tabsContainer.appendChild(btn);
    });
}

// 2. 教材データを表示する関数
function loadLesson(subjectId) {
    // IDが一致するデータを検索
    const course = courseData.find(item => item.id === subjectId);
    
    if (course) {
        contentArea.innerHTML = course.content;
    } else {
        contentArea.innerHTML = "<h2>準備中</h2><p>この科目のコンテンツは現在作成中です。</p>";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// サイトを開いた時に実行
initializeSite();
</script>

</body>
</html>
