<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI育成ゲーム</title>

<style>
/* CSS部分はそのまま */
</style>
</head>

<body>

<header>
AI育成ゲーム
</header>

<div id="game">

<div id="characterCard">
<div id="avatar">🤖</div>
<div id="name">ミライ</div>
<div id="level">Lv.1</div>

<div class="progress">
<div id="loveBar" class="progressBar"></div>
</div>

<div id="status">

<div class="statusBox">
❤️ 好感度
<div id="love">0</div>
</div>

<div class="statusBox">
🪙 コイン
<div id="coin">0</div>
</div>

</div>
</div>

<div id="chat"></div>

<div id="inputArea">
<input id="message" placeholder="ミライに話しかけよう">
<button id="sendBtn">送信</button>
</div>

<div id="games">

<button class="gameBtn" onclick="searchCoin()">
🪙 コイン探し
</button>

<button class="gameBtn" onclick="playJanken()">
✊ じゃんけん
</button>

<button class="gameBtn" onclick="dailyBonus()">
🎁 ログインボーナス
</button>

<button class="gameBtn" onclick="buyGift()">
🎀 プレゼント
</button>

</div>

<div id="eventBox">
ミライと仲良くなろう！
</div>

</div>

<script>
// ステータス、初期化関数など、既存コードをそのまま保持
let love = Number(localStorage.getItem("love")) || 0;
let coin = Number(localStorage.getItem("coin")) || 0;
let level = Number(localStorage.getItem("level")) || 1;
let lastBonus = localStorage.getItem("bonus") || "";

const chat = document.getElementById("chat");

updateStatus();

addAI("こんにちは！私はミライだよ！");

document
.getElementById("sendBtn")
.addEventListener("click",sendMessage);

document
.getElementById("message")
.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
        sendMessage();
    }
});

function save(){
    localStorage.setItem("love",love);
    localStorage.setItem("coin",coin);
    localStorage.setItem("level",level);
}

function addUser(text){
    chat.innerHTML += `
    <div class="user">
      <div class="bubble">${text}</div>
    </div>
    `;
    scrollBottom();
}

function addAI(text){
    chat.innerHTML += `
    <div class="ai">
      <div class="bubble">${text}</div>
    </div>
    `;
    scrollBottom();
}

function scrollBottom(){
    chat.scrollTop = chat.scrollHeight;
}

// Hugging Face Spaceを利用してAI応答を取得
async function fetchAIResponse(msg) {
    const apiUrl = "https://api-inference.huggingface.co/models/YourModel"; // Hugging FaceモデルのAPIエンドポイントに変更
    const apiKey = "YOUR_API_KEY"; // Hugging FaceのAccess Tokenを記載

    try {
        const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                inputs: msg,
            }),
        });

        if (!response.ok) {
            throw new Error("APIエラー");
        }

        const result = await response.json();
        const replyText = result[0]?.generated_text || "応答が見つかりませんでした。";
        return replyText;

    } catch (error) {
        console.error(error);
        return "現在AIと通信できません。";
    }
}

async function sendMessage(){
    const input = document.getElementById("message");
    const msg = input.value.trim();

    if(!msg) return;

    addUser(msg);
    input.value = "";

    setTimeout(async ()=>{
        const aiResponse = await fetchAIResponse(msg); // Hugging Face経由でレスポンス取得
        addAI(aiResponse);
        processLoveGain(aiResponse); // 応答内容に応じて好感度を上げる
    },400);
}

function processLoveGain(response) {
    // 応答内容に応じた好感度の変動処理（任意）
    if (response.includes("頑張った") || response.includes("嬉しい")) {
        love += 3;
    } else {
        love += 1;
    }

    levelCheck();
    updateStatus();
    save();
}

function levelCheck(){
    const next = level * 30;

    if(love >= next){
        level++;
        coin += 20;

        addAI("レベルアップ！Lv."+level+"になったよ！");
    }
}

function updateStatus(){
    document.getElementById("love").textContent = love;
    document.getElementById("coin").textContent = coin;
    document.getElementById("level").textContent = "Lv."+level;

    const max = level * 30;
    const percent = Math.min(100, love / max * 100);
    document.getElementById("loveBar").style.width = percent + "%";
}

// 以下の関数（コイン操作・ミニゲーム）はそのまま
function searchCoin(){ /* ...既存コード... */ }
function playJanken(){ /* ...既存コード... */ }
function dailyBonus(){ /* ...既存コード... */ }
function buyGift(){ /* ...既存コード... */ }

</script>

<script src="script.js" defer></script>

</body>
</html>
