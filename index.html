<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オンライン教材サイト - StudyText</title>

<style>
:root {
    --primary-color: #0ea5e9;
    --bg-color: #f8fafc;
    --surface-color: #ffffff;
    --text-main: #334155;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --accent-bg: #f0f9ff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    line-height: 1.8;
}

/* ヘッダー */
header{
    position:sticky;
    top:0;
    z-index:100;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-color);
}

h1{
    margin:0;
    padding:16px 12px 12px;
    font-size:22px;
    font-weight: 700;
    text-align:center;
    color: #0f172a;
}

/* タブナビゲーション */
.tabs{
    display:flex;
    justify-content: center;
    overflow-x:auto;
    gap:8px;
    padding:12px 16px;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 600;
    border:none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    cursor:pointer;
    transition: all 0.2s ease;
    white-space: nowrap; /* 文字落ち防止 */
}

.tab:hover {
    background: var(--border-color);
    color: var(--text-main);
}

.tab.active{
    background: var(--primary-color);
    color: white;
    box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
}

/* メインコンテンツ */
main{
    padding: 30px 16px;
    max-width: 760px;
    margin: 0 auto;
}

.lesson-content {
    background: var(--surface-color);
    border-radius:16px;
    padding: 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    margin-bottom: 40px;
}

/* タイポグラフィ */
.lesson-content h2 {
    font-size: 24px;
    color: #0f172a;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 12px;
    margin-top: 0;
    margin-bottom: 24px;
}

.lesson-content h3 {
    font-size: 18px;
    color: var(--primary-color);
    margin-top: 32px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
}
.lesson-content h3::before {
    content: "■";
    margin-right: 8px;
    font-size: 14px;
}

.lesson-content p {
    margin-bottom: 20px;
}

.lesson-content ul {
    background: var(--bg-color);
    padding: 20px 20px 20px 40px;
    border-radius: 8px;
    margin-bottom: 24px;
}

.lesson-content li {
    margin-bottom: 8px;
}

.important-box {
    background: var(--accent-bg);
    border-left: 4px solid var(--primary-color);
    padding: 16px 20px;
    border-radius: 0 8px 8px 0;
    margin: 24px 0;
}

.important-box strong {
    color: var(--primary-color);
    display: block;
    margin-bottom: 8px;
}

/* フッター */
footer{
    text-align:center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size:14px;
    border-top: 1px solid var(--border-color);
}

@media (max-width: 600px) {
    .lesson-content {
        padding: 24px 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📘 StudyText Online</h1>
    <div class="tabs" id="tabs"></div>
</header>

<main>
    <div class="lesson-content" id="contentArea"></div>
</main>

<footer>
    © 2026 メーカー勤務理系おじさんの資格勉強ノート
</footer>

<script>
// ==========================================
// 💡 設定エリア：ここだけを編集すればOKです！
// ==========================================
const courseData = [
    {
        id: "xray",
        tabName: "Study",  // ← ここを変えればタブの名前も変わります！
        content: `
            <h2>X線作業主任者 第1章：基礎知識</h2>
            <p>X線作業主任者の試験において、最も基本となるのが「放射線の種類」と「管理区域」の概念です。</p>
            <h3>1. 放射線の種類と性質</h3>
            <p>エックス線は電磁波の一種であり、物質を透過する能力を持っています。</p>
            <ul>
                <li><strong>電離作用：</strong> 物質を通過する際、原子から電子を弾き飛ばす作用。</li>
                <li><strong>透過作用：</strong> 物質を通り抜ける性質。鉛などの重金属で遮蔽する。</li>
            </ul>
        `
    },
    {
        id: "kiken",
        tabName: "Notes",
        content: `
            <h2>危険物取扱者 乙種4類：物理と化学</h2>
            <p>乙種4類（引火性液体）の性質を理解する前に、まずは基礎的な物理と化学の法則を復習しましょう。</p>
            <h3>1. 燃焼の3要素</h3>
            <ul>
                <li>可燃物（燃えるもの）</li>
                <li>酸素供給体（空気など）</li>
                <li>点火源（火花や静電気など）</li>
            </ul>
        `
    },
    {
        id: "qc",
        tabName: "Chill",
        content: `
            <h2>QC検定（品質管理検定） 入門</h2>
            <p>品質管理（Quality Control）の基本となる考え方と、QC七つ道具について学びます。</p>
            <h3>QC七つ道具とは？</h3>
            <p>データを視覚的に整理し、問題の発見や解決に役立てるためのツール群です。</p>
        `
    },
    {
        id: "fp",
        tabName: " Coming Soon",
        content: `
            <h2>FP3級 ライフプランニング</h2>
            <p>人生の夢や目標をかなえるために、資金計画を立てることをライフプランニングといいます。</p>
            <div class="important-box">
                <strong>💡 社会保険の基本</strong>
                健康保険、年金、雇用保険などの基礎知識は必ず出題されます。
            </div>
        `
    }
];
// ==========================================
// これ以降のシステム部分は自動で動くので編集不要です
// ==========================================

const tabsContainer = document.getElementById("tabs");
const contentArea = document.getElementById("contentArea");

// 1. タブを自動生成する関数
function initializeSite() {
    courseData.forEach((course, index) => {
        // ボタン要素を作成
        const btn = document.createElement("button");
        btn.className = "tab";
        btn.textContent = course.tabName; // データからタブ名をセット
        
        // 最初の一つだけ「active」状態にする
        if (index === 0) {
            btn.classList.add("active");
            loadLesson(course.id); // 最初のコンテンツを表示
        }

        // タップした時の動き
        btn.addEventListener("click", () => {
            // 全てのタブからactiveを外して、クリックしたタブに付ける
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");
            
            // 該当するコンテンツを表示
            loadLesson(course.id);
        });

        // ヘッダーにボタンを追加
        tabsContainer.appendChild(btn);
    });
}

// 2. 教材データを表示する関数
function loadLesson(subjectId) {
    // IDが一致するデータを検索
    const course = courseData.find(item => item.id === subjectId);
    
    if (course) {
        contentArea.innerHTML = course.content;
    } else {
        contentArea.innerHTML = "<h2>準備中</h2><p>この科目のコンテンツは現在作成中です。</p>";
    }
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// サイトを開いた時に実行
initializeSite();
</script>

</body>
</html>
