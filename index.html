<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Puzzle</title>

<style>
body{margin:0;background:#111;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#menuBar{height:50px;background:#222;display:flex;justify-content:space-between;align-items:center;padding:0 10px;}
#enemySection,#playerSection{display:flex;align-items:center;gap:10px;padding:6px 10px;}
.characterImage{width:70px;height:70px;background:#333;border-radius:10px;}
#boardArea{flex:1;display:flex;justify-content:center;align-items:center;}
#board{background:#222;border-radius:12px;}
#adArea{height:60px;background:#222;display:flex;justify-content:center;align-items:center;}
</style>
</head>

<body>

<div id="menuBar">
<button>MENU</button>
<div>Battle Puzzle</div>
<button>SET</button>
</div>

<div id="enemySection">
<img class="characterImage">
<div>
<div id="enemyHp"></div>
<div id="enemyAttack"></div>
</div>
</div>

<div id="boardArea">
<canvas id="board"></canvas>
</div>

<div id="playerSection">
<img class="characterImage">
<div>
<div id="playerHp"></div>
<div id="playerAttack"></div>
</div>
</div>

<div id="adArea">AD</div>

<script src="game.js"></script>

</body>
</html>
