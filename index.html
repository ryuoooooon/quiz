<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Puzzle</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="enemyArea">

    <div class="enemyInfo">
        <div class="hpBar">
            <div id="enemyHp"></div>
        </div>

        <div class="attackBar">
            <div id="enemyAttack"></div>
        </div>
    </div>

    <div class="enemyCharacter">
        CPU
    </div>

</div>

<div id="gameArea">

    <canvas id="board"></canvas>

    <div id="playerPanel">

        <div class="character">
            PLAYER
        </div>

        <div class="hpBar">
            <div id="playerHp"></div>
        </div>

        <div class="attackBar">
            <div id="playerAttack"></div>
        </div>

    </div>

</div>

<script src="game.js"></script>
</body>
</html>
